# Render Blueprint for the Nura Health ML backend (FastAPI).
# In Render: New + -> Blueprint -> pick this repo. It reads this file.
services:
  - type: web
    name: nura-health-api
    runtime: python
    plan: free
    rootDir: nurahealth_backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # numpy 1.24 / scikit-learn 1.3 only have wheels for Python <= 3.11.
      # Without this, Render uses 3.13 and the build fails compiling numpy.
      - key: PYTHON_VERSION
        value: 3.11.9
